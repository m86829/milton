name: 自動同步 Notion 文章

on:
  schedule:
    # 每天 UTC 19:00（台灣時間凌晨 03:00）自動執行一次
    - cron: '0 19 * * *'
  # 同時允許你在 GitHub 網頁手動按按鈕觸發
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 安裝前端依賴套件
        run: npm ci || npm install

      - name: 執行 Notion 內容同步（文章、作品集、時間軸）
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_PROJECTS_DATABASE_ID: ${{ secrets.NOTION_PROJECTS_DATABASE_ID }}
          NOTION_TIMELINE_DATABASE_ID: ${{ secrets.NOTION_TIMELINE_DATABASE_ID }}
        run: npm run sync:notion

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 安裝後端依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 自動重建 Chroma 向量資料庫快取
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          rm -rf backend/chroma_db
          python -c "import sys; sys.path.append('backend'); from main import init_rag_system; init_rag_system()"

      - name: 檢查變更並自動提交更新
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/ public/posts/ public/images/notion/ public/projects/ public/previews/ backend/chroma_db/
          git diff --staged --quiet || (git commit -m "chore: 自動同步 Notion 最新內容與向量快取" && git push)