name: 自動同步 Notion 文章

on:
  schedule:
    # 每 24 小時自動執行一次 (UTC 時間每逢 24 小時整點)
    - cron: '0 */24 * * *'
  # 同時允許你在 GitHub 網頁手動按按鈕觸發
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 安裝前端依賴套件
        run: npm ci || npm install

      - name: 執行 Notion 文章同步
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run sync:notion

      # 🌟 新增：設定 Python 環境
      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      # 🌟 新增：安裝後端依賴
      - name: 安裝後端依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 🌟 新增：執行向量資料庫建立
      - name: 自動建置 Chroma 向量資料庫快取
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "import sys; sys.path.append('backend'); from main import init_rag_system; init_rag_system()"

      # 🌟 修改：將 backend/chroma_db 一併加入 Git 提交
      - name: 檢查變更並自動提交更新
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/posts.json public/images/notion/ backend/chroma_db/
          git diff --staged --quiet || (git commit -m "chore: 自動同步 Notion 最新文章與向量快取" && git push)