name: 自動同步 Notion 文章

on:
  schedule:
    # 每 3 小時自動執行一次 (UTC 時間每逢 3 小時整點)
    - cron: '0 */3 * * *'
  # 同時允許你在 GitHub 網頁手動按按鈕觸發
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝依賴套件
        run: npm ci || npm install

      - name: 執行 Notion 文章同步
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run sync:notion

      - name: 檢查變更並自動提交更新
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/posts.json public/images/notion/
          git diff --staged --quiet || (git commit -m "chore: 自動同步 Notion 最新文章與圖片 [skip ci]" && git push)